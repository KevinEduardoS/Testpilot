version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: testpilot-postgres
    environment:
      POSTGRES_DB: testpilot
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testpilot -d testpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: testpilot-api
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://testpilot:testpilot@postgres:5432/testpilot
      INTERNAL_API_KEY: change-me
      ANTHROPIC_API_KEY: replace-me
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      RUNNER_URL: http://runner:3002
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\'http://127.0.0.1:3001/health\').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -lc 'npm install && npm --workspace apps/api run dev -- --host 0.0.0.0 --port 3001'

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    container_name: testpilot-runner
    environment:
      NODE_ENV: development
      PORT: 3002
      INTERNAL_API_KEY: change-me
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\'http://127.0.0.1:3002/health\').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -lc 'npm install && npm --workspace apps/runner run dev -- --host 0.0.0.0 --port 3002'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: testpilot-web
    depends_on:
      api:
        condition: service_started
      runner:
        condition: service_started
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -lc 'npm install && npm --workspace apps/web run dev -- --host 0.0.0.0 --port 5173'

volumes:
  postgres_data:
