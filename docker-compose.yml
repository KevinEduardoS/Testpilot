# Entorno de desarrollo local. Las variables se interpolan desde el .env de la raíz,
# pero cada servicio recibe solo las que necesita y el .env no se monta en los contenedores.
# Solo se montan las carpetas src: node_modules viene de la imagen (Linux), no del host.

services:
  postgres:
    image: postgres:16-alpine
    container_name: testpilot-postgres
    environment:
      POSTGRES_DB: testpilot
      POSTGRES_USER: testpilot
      POSTGRES_PASSWORD: testpilot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U testpilot -d testpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: testpilot-api
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_PORT: 3001
      RUNNER_URL: http://runner:3002
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://testpilot:testpilot@postgres:5432/testpilot
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - ./packages/shared/src:/workspace/packages/shared/src

  # Sin puertos publicados: solo la API puede llegar al runner, por la red interna.
  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    container_name: testpilot-runner
    environment:
      NODE_ENV: development
      RUNNER_PORT: 3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Define INTERNAL_API_KEY en .env}
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./apps/runner/src:/workspace/apps/runner/src
      - ./packages/shared/src:/workspace/packages/shared/src

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: testpilot-web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./packages/shared/src:/workspace/packages/shared/src

volumes:
  postgres_data:
